name: Build Telegram Desktop (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ninja & CMake
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Prepare build environment
        shell: cmd
        run: |
          git clone --depth=1 https://github.com/desktop-app/patches.git patches

      - name: Build Telegram
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          python Telegram/build/prepare/win.py
          cmake -B out -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out --target Telegram

      - name: Upload Telegram Binary
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Desktop-Build
          path: out/bin/Telegram.exe
