name: Build Telegram Desktop (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Ninja & CMake
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Set up MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'
          modules: 'qtimageformats'

      - name: Install Missing C++ Dependencies (vcpkg)
        shell: cmd
        run: |
          vcpkg install ada:x64-windows range-v3:x64-windows tl-expected:x64-windows lz4:x64-windows xxhash:x64-windows zlib:x64-windows

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DDESKTOP_APP_QT_VERSION=6 ^
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
            -DDESKTOP_APP_DISABLE_DBUS_INTEGRATION=ON ^
            -DTDESKTOP_API_ID=17349 ^
            -DTDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb

      - name: Build Telegram Desktop
        shell: cmd
        run: |
          cmake --build build --config Release --target Telegram

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Windows-x64
          path: build/bin/Telegram.exe
