name: Windows

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories
        run: |
          mkdir "%USERPROFILE%\TBuild\Libraries"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Setup environment and keys
        shell: bash
        run: |
          DOCPATH="$TBUILD/$REPO_NAME/docs/building-win.md"
          SDK="10.0.22621.0"
          if [ -f "$DOCPATH" ]; then
            PARSED_SDK="$(grep -o -E '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' "$DOCPATH" | head -n 1 || true)"
            [ -n "$PARSED_SDK" ] && SDK="$PARSED_SDK"
          fi
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum "$TBUILD/$REPO_NAME/$PREPARE_PATH" 2>/dev/null | awk '{ print $1 }' || echo 'default')" > CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "build@tdesktop.internal"
          git config --global user.name "Builder"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: ${{ env.SDK }}

      - name: ThirdParty Cache
        id: cache-third-party
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-x64-third-party-

      - name: Libraries Cache
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-x64-libs-v2-

      - name: Qt Cache
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.os }}-x64-qt6-

      - name: Prepare Libraries
        run: |
          cd "%TBUILD%\%REPO_NAME%"
          call Telegram\build\prepare\win.bat skip-release silent qt6

      - name: Configure CMake
        run: |
          cd "%TBUILD%\%REPO_NAME%\Telegram"
          call configure.bat x64 qt6 ^
            -D TDESKTOP_API_TEST=ON ^
            -D CMAKE_CONFIGURATION_TYPES=Debug ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build Telegram
        run: |
          cd "%TBUILD%\%REPO_NAME%"
          cmake --build out --config Debug --parallel

      - name: Prepare Artifacts
        run: |
          mkdir "%GITHUB_WORKSPACE%\artifact"
          copy "%TBUILD%\%REPO_NAME%\out\Debug\Telegram.exe" "%GITHUB_WORKSPACE%\artifact\" || copy "%TBUILD%\%REPO_NAME%\out\bin\Telegram.exe" "%GITHUB_WORKSPACE%\artifact\"

      - name: Upload Telegram Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Desktop-Win64
          path: artifact\Telegram.exe
